<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TournamentOS" />
    <meta name="theme-color" content="#07090f" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>TournamentOS</title>

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        scroll-behavior: smooth;
      }

      body {
        margin: 0; padding: 0;
        background: #07090f;
        color: #edf0f7;
        font-family: 'Georgia', 'Times New Roman', serif;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        min-height: 100dvh;
      }

      /* ── Mobile: safe areas ── */
      @media (max-width: 767px) {
        body {
          padding-top: env(safe-area-inset-top, 0px);
          padding-bottom: env(safe-area-inset-bottom, 0px);
          padding-left: env(safe-area-inset-left, 0px);
          padding-right: env(safe-area-inset-right, 0px);
          -webkit-user-select: none;
          user-select: none;
        }
        input, textarea, p, h1, h2, h3, h4, span {
          -webkit-user-select: text;
          user-select: text;
        }
      }

      /* ── PC: comfortable reading width ── */
      @media (min-width: 768px) {
        body {
          background: #04060c;
        }
      }

      #root {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* ── Inputs: prevent iOS zoom ── */
      input, select, textarea { font-size: 16px !important; border-radius: 10px; }
      button { min-height: 44px; cursor: pointer; }
      table { border-collapse: collapse; width: 100%; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
      @media (max-width: 767px) { ::-webkit-scrollbar { display: none; } * { scrollbar-width: none; } }

      input[type="date"], input[type="datetime-local"], input[type="time"] { color-scheme: dark; }
      :focus-visible { outline: 2px solid #4f8ef7; outline-offset: 2px; }
      :focus:not(:focus-visible) { outline: none; }
      img { max-width: 100%; height: auto; display: block; }

      /* ── PC: top navbar ── */
      @media (min-width: 768px) {
        .bottom-nav-mobile { display: none !important; }
        .top-nav-pc { display: flex !important; }
        .main-content-pc {
          padding-bottom: 32px !important;
          padding-top: 20px !important;
        }
      }
      @media (max-width: 767px) {
        .top-nav-pc { display: none !important; }
        .bottom-nav-mobile { display: flex !important; }
      }

      /* ── Loading screen ── */
      #loading {
        position: fixed; inset: 0; background: #07090f;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999; flex-direction: column; gap: 16px;
      }
      #loading-icon {
        width: 52px; height: 52px;
        background: linear-gradient(135deg, #e8b84b, #c9952a);
        border-radius: 14px; display: flex; align-items: center;
        justify-content: center; font-size: 26px;
      }
      #loading-text {
        font-family: 'Georgia', serif; font-size: 11px;
        letter-spacing: 4px; text-transform: uppercase; color: #4f8ef7;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div id="loading-icon">⚔</div>
      <div id="loading-text">TournamentOS</div>
    </div>
    <div id="root"></div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(() => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
